# Known vulnerabilities in the locked dependencies: when uv.lock changes,
# once a week (new advisories appear while the lock file stays the same),
# and by hand. No API key is needed.

name: audit

on:
  push:
    paths:
      - uv.lock
  pull_request:
    paths:
      - uv.lock
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.13"
          enable-cache: true

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.51.1"

      # GitHub sets CI=true, so the task calls uv directly, without Docker.
      - name: Check the locked dependencies
        run: task audit
