[project]
name = "marketdesk-agent"
version = "0.1.0"
description = "Marketplace customer-support and operations agent system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-llms-google-genai==0.11.2",
    "llama-index-llms-groq==0.6.1",
    "llama-index-tools-mcp==0.6.0",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "sqlglot==30.21.0",
]

[dependency-groups]
dev = [
    "kagglehub==1.0.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
# An application, not a library: nothing to build or install as a package.
package = false

[tool.pytest.ini_options]
# Lets tests import top-level modules and folders (config, data, scripts, src).
pythonpath = ["."]
testpaths = ["tests"]
